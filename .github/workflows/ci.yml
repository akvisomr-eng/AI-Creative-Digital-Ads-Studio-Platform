name: Platform CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Generate reviewed SQL migration artifact
        env:
          DRIZZLE_GENERATE: true
        run: npm run db:generate
      - name: Commit generated lockfile and migration
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json drizzle/
          if ! git diff --cached --quiet; then
            git commit -m "build: commit reproducible lockfile and initial migration"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: drizzle-migrations
          path: drizzle/
          if-no-files-found: error
      - run: npm run build
